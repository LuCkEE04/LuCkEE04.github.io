<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Javier Layne — Contact Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <nav class="site-nav" aria-label="Main">
    <div class="site-nav__inner">
      <a class="site-nav__prompt" href="index.html">jlayne@site:~$</a>
      <ul class="site-nav__links">
        <li><a href="index.html">home</a></li>
        <li><a href="projects.html">projects</a></li>
        <li><a href="contact.html" aria-current="page">contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="page">

    <div id="header">
      <div>
        <h1>Contact <span>Me</span></h1>
        <p class="role-line">Send a message and I'll get back to you</p>
      </div>
    </div>

    <section>
      <form class="form-panel" id="contact-form" novalidate>
        <div class="field">
          <label for="name">name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="message">message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button class="btn" type="submit">./send-message</button>
        <p id="form-status" role="status" aria-live="polite"></p>

        <p class="form-note">
          This form is a front-end simulation for this class assignment &mdash; no message
          is actually sent anywhere yet.
        </p>
      </form>
    </section>

    <div id="footer">
      &copy; 2026 Javier Layne &mdash; built as a class assignment
    </div>

  </div>

  <script src="assets/script.js"></script>
</body>
</html>
